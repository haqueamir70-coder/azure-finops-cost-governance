  <g filter="url(#shadow)">
    <rect x="866" y="424" width="282" height="108" rx="18" fill="#0f504d" stroke="#37c7ad" stroke-width="1.4"/>
    <text x="890" y="458" class="nodeTitle">FinOps Review</text>
    <text x="890" y="482" class="nodeText">Finance + engineering + service owner</text>
    <text x="890" y="505" class="nodeText">Approve actions; validate real savings</text>
  </g>
  <path d="M866 477H810V403H780V380" class="edgeGreen" opacity=".7" stroke-dasharray="6 6"/>
  <text x="64" y="463" class="section">02 / GOVERNANCE &amp; DELIVERY CONTROLS</text>

  <g filter="url(#shadow)">
    <rect x="64" y="492" width="338" height="166" rx="18" fill="#173755" stroke="#4c99d0" stroke-width="1.4"/>
    <rect x="64" y="492" width="338" height="8" rx="4" fill="url(#blue)"/>
    <circle cx="100" cy="535" r="17" fill="#0879d9"/><path d="M92 529H108V543H92Z M96 525H104V529" fill="none" stroke="#fff" stroke-width="1.6"/>
