    <text x="88" y="578" class="nodeText">Azure budget / governance resources</text>
    <text x="88" y="600" class="nodeText">Explicit scope · tags · variables</text>
    <text x="88" y="631" class="small">PLAN + REVIEW BEFORE APPLY</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="452" y="492" width="338" height="166" rx="18" fill="#15395d" stroke="#3187c4" stroke-width="1.4"/>
    <rect x="452" y="492" width="338" height="8" rx="4" fill="url(#blue)"/>
    <circle cx="488" cy="535" r="17" fill="#0879d9"/><path d="M480 531L488 526L496 531V540L488 545L480 540Z M484 535L487 538L493 532" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="516" y="540" class="nodeTitle">GitHub Actions CI</text>
    <text x="476" y="578" class="nodeText">Python unit tests · Terraform validate</text>
    <text x="476" y="600" class="nodeText">Formatting · IaC security scan</text>
    <text x="476" y="631" class="small">NO AZURE DEPLOYMENT CREDENTIALS</text>
  </g>
  <path d="M402 575H446" class="edge"/>
  <path d="M621 492V445H525V380" class="edge" opacity=".75"/>
  <g filter="url(#shadow)">
    <rect x="840" y="582" width="308" height="94" rx="18" fill="#133f43" stroke="#2bb99f" stroke-width="1.4"/>
