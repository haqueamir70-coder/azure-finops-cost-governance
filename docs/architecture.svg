  <g filter="url(#shadow)">
    <rect x="952" y="230" width="196" height="150" rx="18" fill="#15395d" stroke="#3187c4" stroke-width="1.4"/>
    <rect x="952" y="230" width="196" height="8" rx="4" fill="url(#blue)"/>
    <circle cx="986" cy="271" r="16" fill="#0879d9"/><path d="M979 263H993V279H979Z M982 267H990M982 271H990M982 275H988" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="1012" y="274" class="nodeTitle">Reports</text>
