  <path d="M840 629H810V698H233V664" class="edgeGreen" opacity=".7" stroke-dasharray="6 6"/>

  <rect x="64" y="728" width="1084" height="92" rx="18" fill="#0b2038" stroke="#294b6b"/>
  <text x="88" y="760" class="section">SECURITY &amp; TRUST BOUNDARIES</text>
  <text x="88" y="790" class="nodeText">Least privilege</text><text x="260" y="790" class="nodeText">Sanitized data</text><text x="420" y="790" class="nodeText">No committed secrets</text><text x="635" y="790" class="nodeText">No auto-remediation</text><text x="862" y="790" class="nodeText">Reviewed Terraform plans</text>
  <text x="64" y="864" class="sub">REFERENCE / LAB DESIGN  •  Synthetic demo data  •  Live Azure integration is an explicit extension point</text>
