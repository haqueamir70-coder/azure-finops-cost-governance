<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Azure FinOps and Cost Governance Platform Architecture</title>
  <desc id="desc">A premium dark navy architecture diagram showing Azure cost data flowing through a Python analyzer to reports and FinOps review, with Terraform governance guardrails and GitHub Actions quality gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/><stop offset="100%" stop-color="#102b4c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0879d9"/><stop offset="100%" stop-color="#2aa8ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6545c5"/><stop offset="100%" stop-color="#9a75ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007e78"/><stop offset="100%" stop-color="#26c6a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000814" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fcaff"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#62e6c7"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#fff}.sub{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#b7cbe2}
      .section{font:700 15px 'Segoe UI',Arial,sans-serif;letter-spacing:1.8px;fill:#9bc8f3}
      .nodeTitle{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#fff}.nodeText{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#d7e7f7}
      .small{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#b4cbe4;letter-spacing:.5px}
      .edge{fill:none;stroke:#8fcaff;stroke-width:2.5;marker-end:url(#arrow)}
      .edgeGreen{fill:none;stroke:#62e6c7;stroke-width:2.5;marker-end:url(#arrowGreen)}
      .pill{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#e9f4ff}
    </style>
  </defs>
  <rect width="1440" height="900" rx="26" fill="url(#bg)"/>
  <g opacity=".16" stroke="#64b9ff" stroke-width="1"><path d="M0 120H1440M0 220H1440M0 320H1440M0 420H1440M0 520H1440M0 620H1440M0 720H1440M0 820H1440"/><path d="M120 0V900M240 0V900M360 0V900M480 0V900M600 0V900M720 0V900M840 0V900M960 0V900M1080 0V900M1200 0V900M1320 0V900"/></g>
  <text x="64" y="70" class="title">AZURE FINOPS</text>
  <text x="64" y="108" class="title" style="font-size:27px">Cost Governance &amp; Optimization Platform</text>
  <text x="64" y="140" class="sub">Visibility · Accountability · Budget Guardrails · Reviewable Automation</text>
  <rect x="1130" y="54" width="244" height="42" rx="21" fill="#183d5f" stroke="#428fcb"/>
  <circle cx="1152" cy="75" r="5" fill="#62e6c7"/><text x="1167" y="80" class="pill">REFERENCE ARCHITECTURE</text>

